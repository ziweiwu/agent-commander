# gitleaks configuration.
#
# The default ruleset, plus one allowance. `useDefault = true` matters: without
# it a config file REPLACES the built-in rules rather than adding to them, and
# the scanner would go quiet about everything.
[extend]
useDefault = true

[allowlist]
description = "RFC 6455's example Sec-WebSocket-Key"
# `dGhlIHNhbXBsZSBub25jZQ==` is base64 for "the sample nonce" -- the literal
# example key printed in RFC 6455 section 1.3, and the one every WebSocket
# handshake test in the world sends. gitleaks reads it as a generic-api-key
# because it is base64 after a header called `Key:`.
#
# It is not a credential and there is nothing to rotate: the value is fixed by
# the standard, and the server's reply to it is a pure function of it. The three
# hits are hand-rolled handshakes in rust/src/routes.rs that assert INV-3
# refuses a cross-origin or rebound upgrade.
regexes = ['''dGhlIHNhbXBsZSBub25jZQ==''']
