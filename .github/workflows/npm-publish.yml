# Publish to npm when a v* tag is pushed.
#
# The tag is the trigger and the source of truth for the version: the job
# refuses to run if the tag and package.json disagree, because a mismatch means
# whatever gets published is not the thing the tag names, and npm versions are
# immutable once they land.
name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole authentication story. npm trusted publishing exchanges this
      # short-lived OIDC token for publish rights, so there is no NPM_TOKEN in
      # repo secrets to leak, rotate or forget. It also gets provenance for
      # free: the npm page carries a signed link back to this commit.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # ubuntu-latest ships an npm too old to know about trusted publishing,
      # which arrived in 11.5.1. Without this the publish step falls back to
      # looking for a token and fails.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Tag must match package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag $GITHUB_REF_NAME says $tag, package.json says $pkg" >&2
            exit 1
          fi
          echo "publishing $pkg"

      # The deterministic gates. The browser audits (contrast, a11y, ux, mobile)
      # deliberately stay out of the release path: they need a running server
      # and a real Chromium, and font rendering differs enough between macOS and
      # ubuntu-latest that a layout finding here would block a release for a
      # reason that has nothing to do with the release.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # No token: rights come from the OIDC exchange above, which npm matches
      # against the trusted publisher configured for this package.
      - name: Publish
        run: npm publish --access public
