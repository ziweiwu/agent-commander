# The deterministic gates, on every change rather than only at release.
#
# These same four commands already run in `npm-publish.yml`. Running them only
# there meant they fired when a `v*` tag was pushed — that is, at the moment it
# is most expensive to learn something is broken, with a version number already
# committed to and npm versions immutable once they land. This workflow moves
# the discovery to the change that caused it; the publish workflow keeps its own
# copy so a release is never taken on trust from a green branch.
#
# The end-to-end suite runs here too, in a job of its own. It needs a real
# Chromium, which is why it is a job of its own — but unlike the audits
# it judges behaviour rather than appearance, so nothing about it depends on how
# a runner renders a font. It drives `--mock`, which is the same server and the
# same routes with the four providers swapped for fixtures, so it cannot reach a
# real agent.
#
# What is deliberately NOT here, for the same reason `npm-publish.yml` gives:
# the browser audits (`npm run audit` — contrast, a11y, ux, mobile) and the
# randomised sweep (`npm run qa`) need a running server and a real Chromium, and
# font rendering differs enough between macOS and ubuntu-latest that a layout
# finding would fail CI for a reason that has nothing to do with the change.
# `npm run verify:inv1` is out for a stronger reason still: it drives a real
# attach against a live Claude Code agent on a live tmux server, which does not
# exist on a runner. Both stay local, and stay a habit rather than a gate.
name: CI

on:
  push:
    branches:
      - '**'
    # Tags are `npm-publish.yml`'s job; without this a release runs both.
    tags-ignore:
      - '**'
  pull_request:

# A branch that gets three pushes in a minute should test the last one, not all
# three. In-progress runs for the same ref are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # 22, not the `engines` floor. `jsdom@30` — which only the component
          # tests use — requires `^22.22.2 || ^24.15.0 || >=26`, and on Node 20
          # its undici calls `webidl.util.markAsUncloneable`, which does not
          # exist there: every jsdom worker fails to start. That is a limit of
          # the *toolchain*, not of the app, and the `floor` job below is what
          # keeps the two claims apart.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  floor:
    # What `engines: node >= 20` actually promises, checked at the floor.
    #
    # It is a claim about running the published package, and the published
    # package is `dist/` plus one runtime dependency (`ws`). Running the test
    # suite here would test jsdom's Node support instead, which is what the
    # first version of this workflow did — it failed, and it was asking the
    # wrong question. This builds the thing that ships and then runs it, which
    # is the same failure mode that put a do-nothing binary in 0.1.0 to 0.1.3.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # The dev dependencies are installed even though some of them declare a
      # newer Node than this: the build needs them, and npm reports an engine
      # mismatch in a devDependency as a warning rather than a failure. What
      # must work here is everything below this line.
      - run: npm ci

      - run: npm run build

      - name: the built CLI starts
        run: node dist/server/cli.js --help

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # This job is about the browser and the server agreeing, so it runs
          # on one Node. `floor` is where the engines claim is checked.
          node-version: 22
          cache: npm

      - run: npm ci

      # The mock server still probes the real machine for `ServerEnv`, and the
      # New Agent dialog refuses to offer the form when tmux is absent — which
      # is correct, and which made two specs fail here and nowhere else. A
      # runner without tmux is not the machine this app is for.
      - name: install tmux, which the New Agent flow requires
        run: sudo apt-get update && sudo apt-get install -y tmux

      # Only Chromium, which is what `playwright.config.ts` pins all three
      # projects to. The suite drives three viewports through it — desktop,
      # tablet and phone — which is where the layout genuinely differs.
      - run: npx playwright install --with-deps chromium

      # `playwright.config.ts` builds the web assets and starts the mock server
      # itself, so there is nothing to start here.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        # Traces are kept for the first retry, so they exist exactly when
        # someone needs them: a failure that did not reproduce.
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
