# The deterministic gates, on every change rather than only at release.
#
# These same five commands already run in `npm-publish.yml`. Running them only
# there meant they fired when a `v*` tag was pushed — that is, at the moment it
# is most expensive to learn something is broken, with a version number already
# committed to and npm versions immutable once they land. This workflow moves
# the discovery to the change that caused it; the publish workflow keeps its own
# copy so a release is never taken on trust from a green branch.
#
# The end-to-end suite runs here too, in a job of its own. It needs a real
# Chromium, which is why it is a job of its own — but unlike the audits
# it judges behaviour rather than appearance, so nothing about it depends on how
# a runner renders a font. It drives `--mock`, which is the same server and the
# same routes with the four providers swapped for fixtures, so it cannot reach a
# real agent.
#
# What is deliberately NOT here, for the same reason `npm-publish.yml` gives:
# the browser audits (`npm run audit` — contrast, a11y, ux, mobile) and the
# randomised sweep (`npm run qa`) need a running server and a real Chromium, and
# font rendering differs enough between macOS and ubuntu-latest that a layout
# finding would fail CI for a reason that has nothing to do with the change.
# `npm run verify:inv1` is out for a stronger reason still: it drives a real
# attach against a live Claude Code agent on a live tmux server, which does not
# exist on a runner. Both stay local, and stay a habit rather than a gate.
name: CI

on:
  push:
    branches:
      - '**'
    # Tags are `npm-publish.yml`'s job; without this a release runs both.
    tags-ignore:
      - '**'
  pull_request:

# A branch that gets three pushes in a minute should test the last one, not all
# three. In-progress runs for the same ref are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          # Full history: the clippy ratchet in `npm run lint` holds the lines a
          # change touches to two extra lints, and finds them from the merge
          # base with main.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          # 22, not the `engines` floor. `jsdom@30` — which only the component
          # tests use — requires `^22.22.2 || ^24.15.0 || >=26`, and on Node 20
          # its undici calls `webidl.util.markAsUncloneable`, which does not
          # exist there: every jsdom worker fails to start. That is a limit of
          # the *toolchain*, not of the app, and the `floor` job below is what
          # keeps the two claims apart.
          node-version: 22
          cache: npm

      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # `npm test` runs the Rust suite under nextest; `npm run deps` is
      # cargo-deny, cargo-vet and cargo-machete.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest,cargo-deny,cargo-vet@0.10.2,cargo-machete

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
        env:
          # Run every test rather than stopping at the first failure.
          NEXTEST_PROFILE: ci
      - run: npm run deps
      - run: npm run build

  floor:
    # What `engines: node >= 20` actually promises, checked at the floor.
    #
    # It is a claim about running the published package, and the published
    # package is `dist/` plus one runtime dependency (`ws`). Running the test
    # suite here would test jsdom's Node support instead, which is what the
    # first version of this workflow did — it failed, and it was asking the
    # wrong question. This builds the thing that ships and then runs it, which
    # is the same failure mode that put a do-nothing binary in 0.1.0 to 0.1.3.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # The dev dependencies are installed even though some of them declare a
      # newer Node than this: the build needs them, and npm reports an engine
      # mismatch in a devDependency as a warning rather than a failure. What
      # must work here is everything below this line.
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - run: npm run build

      - name: the built CLI starts
        run: rust/target/release/agent-commander --help

      # `rust-version` is the server's `engines`, and it went false unnoticed:
      # it said 1.82 while the lockfile had moved to crates that need 1.88,
      # because every Rust job here runs `stable`. This builds against the
      # number itself, read from `rust/Cargo.toml` so there is one copy of it.
      - name: the server builds on its declared rust-version
        run: |
          floor=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' rust/Cargo.toml)
          test -n "$floor" || { echo "no rust-version in rust/Cargo.toml" >&2; exit 1; }
          rustup toolchain install "$floor" --profile minimal
          RUSTUP_TOOLCHAIN="$floor" ./scripts/cargo.sh check --locked --manifest-path rust/Cargo.toml

  # Mutation testing, on the Rust a pull request touches and nothing else: a
  # mutant no test catches fails the PR. A full pass takes far too long to run
  # anywhere; `npm run mutants` is the same check against your own branch.
  mutants:
    name: cargo-mutants on the PR diff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-mutants,cargo-nextest

      # Relative to rust/, because cargo-mutants matches the diff's paths
      # against the crate's own.
      - name: Diff against the base branch
        run: git diff --relative=rust "origin/${GITHUB_BASE_REF}...HEAD" > "$RUNNER_TEMP/pr.diff"
      - name: Mutants that no test catches fail the PR
        run: ./scripts/cargo.sh mutants --dir rust --in-place --no-shuffle --in-diff "$RUNNER_TEMP/pr.diff"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: mutants.out
          path: rust/mutants.out
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # This job is about the browser and the server agreeing, so it runs
          # on one Node. `floor` is where the engines claim is checked.
          node-version: 22
          cache: npm

      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The mock server still probes the real machine for `ServerEnv`, and the
      # New Agent dialog refuses to offer the form when tmux is absent — which
      # is correct, and which made two specs fail here and nowhere else. A
      # runner without tmux is not the machine this app is for.
      #
      # A *server*, not just the binary: `available()` asks tmux a question
      # (`display-message -p ok`), and with nothing running there is nobody to
      # answer it. The session is detached and does nothing; it exists so that
      # the socket exists.
      - name: install tmux, which the New Agent flow requires
        run: |
          sudo apt-get update && sudo apt-get install -y tmux
          tmux new-session -d -s ci-keepalive
          tmux display-message -p ok

      # Both engines, because `playwright.config.ts` now names both. The suite
      # drives five projects: desktop, tablet and phone on Chromium, and phone
      # and tablet again on WebKit. The second engine is not redundancy — every
      # browser on iOS is WebKit, and this app's headline feature is reaching it
      # from a phone, so for five releases the only engine that mattered on the
      # target device was the one nothing ran.
      - run: npx playwright install --with-deps chromium webkit

      # `playwright.config.ts` builds the web assets and starts the mock server
      # itself, so there is nothing to start here.
      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        # Traces are kept for the first retry, so they exist exactly when
        # someone needs them: a failure that did not reproduce.
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
