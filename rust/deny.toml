# cargo-deny configuration. `npm run deny` (inside `npm run lint`) and CI run
# `cargo deny --locked check`.

[graph]
# The four targets npm-publish.yml builds and ships.
targets = [
    { triple = "aarch64-apple-darwin" },
    { triple = "x86_64-apple-darwin" },
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "CC0-1.0",
]
# MPL-2.0 is file-level copyleft, so it is allowed for the one crate that needs
# it rather than for the whole graph: option-ext, via dirs -> dirs-sys.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
# Duplicate versions are reported, not fatal: axum, reqwest and notify pin
# different versions of a few shared crates and none of them is ours to fix.
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # reqwest uses rustls so the four release binaries link the same TLS
    # (Cargo.toml); the platform OpenSSL would bring that difference back.
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
