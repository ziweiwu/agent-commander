[package]
name = "agent-commander"
version = "0.7.0"
edition = "2021"
rust-version = "1.82"

description = "See every Claude Code agent on your machine at a glance"
license = "MIT"

[[bin]]
name = "agent-commander"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "net", "sync", "time", "signal"] }
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
hyper = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"
futures-util = "0.3"
subtle = "2"
dirs = "5"
percent-encoding = "2"
rand = "0.8"
async-trait = "0.1.92"
notify = "8.2.0"
libc = "0.2.189"
regex = "1"
sha1 = "0.10"
base64 = "0.22"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
