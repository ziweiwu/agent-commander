<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <title>agent-commander</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>🛰</text></svg>" />
    <!--
      The shell is behind a module download, parse and execute. On a warm
      localhost that is 121ms and nobody notices; over Tailscale on a phone it
      measured 8.7s of an entirely blank page, with nothing on screen to say the
      app was coming. Remote access is this tool's documented purpose, so that
      is the normal case, not the edge one.

      This is deliberately plain CSS in the document head: it has to paint
      before any script runs, so it cannot use the tokens or the app's fonts.
      The two colours are --bg and --dim from tokens.css, copied for both
      schemes; keep them in step by hand if those change.
    -->
    <style>
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0e1116;
        color: #97a3b4;
        font:
          15px/1.4 ui-sans-serif,
          -apple-system,
          system-ui,
          sans-serif;
      }
      .boot-bar {
        width: 140px;
        height: 2px;
        overflow: hidden;
        background: #262d3a;
        border-radius: 2px;
      }
      .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: #4ea8ff;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-bar::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
      @media (prefers-color-scheme: light) {
        .boot {
          background: #f6f7f9;
          color: #55606d;
        }
        .boot-bar {
          background: #dfe3e8;
        }
        .boot-bar::after {
          background: #0b6dcc;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by the app on mount. Wordless on purpose: this paints before
           any script, so it cannot know which language the user chose. -->
      <div class="boot" role="status" aria-label="Loading agent-commander">
        <div>agent-commander</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <noscript>
      <div class="boot">agent-commander needs JavaScript enabled.</div>
    </noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
